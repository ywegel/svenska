name: Pull Request

on:
  pull_request:
    branches: [ master, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  ktlint:
    name: Ktlint
    # Skip draft PRs. All other jobs depend on this one or detekt, so they are skipped too.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 22
        uses: actions/setup-java@v6
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint
        run: ./gradlew ktlintCheck --build-cache --parallel --max-workers=2

  detekt:
    name: Detekt
    # Skip draft PRs. All other jobs depend on this one or ktlint, so they are skipped too.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 22
        uses: actions/setup-java@v6
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run detekt
        run: ./gradlew detekt --build-cache --parallel --max-workers=2


  # TODO: Setup lint to be more aggressive
  lint:
    name: Android Lint
    needs: [ ktlint, detekt ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 22
        uses: actions/setup-java@v6
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android Lint
        run: ./gradlew lint --build-cache --parallel --max-workers=2

      - name: Upload lint results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          retention-days: 7

  unit_tests:
    name: Unit Tests
    needs: [ ktlint, detekt ]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 22
        uses: actions/setup-java@v6
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test --build-cache --parallel --max-workers=2

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Generate Coverage Report
        run: ./gradlew koverXmlReport

      - name: Post coverage comment
        uses: mi-kas/kover-report@v2
        if: github.event_name == 'pull_request'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: app/build/reports/kover/report.xml
          title: Code Coverage Report
          coverage-counter-type: BRANCH

  screenshot_tests:
    name: Screenshot Tests
    needs: [ ktlint, detekt ]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/CompareScreenshot.yml

  screenshot_comment:
    name: Screenshot Comment
    needs: [ screenshot_tests ]
    # Fork PRs only get a read-only token, their diffs stay available as artifacts
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/CompareScreenshotComment.yml

  build-and-test:
    name: Build and Run Instrumentation Tests
    needs: [ lint, unit_tests ]
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xmx4g
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 22
        uses: actions/setup-java@v6
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM for Linux runners
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android Emulator and Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew connectedDebugAndroidTest --build-cache --parallel --max-workers=2

      - name: Upload Instrumentation Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-test-report
          path: app/build/reports/androidTests/connected/
          retention-days: 7
