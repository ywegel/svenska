name: Delete screenshot companion branch

on:
  pull_request:
    types:
      - closed

permissions: { }

jobs:
  # Diff images only live as long as the PR, so they never pile up in the repo
  Delete-Companion-Branch:
    timeout-minutes: 2

    permissions:
      contents: write # for deleting the companion branch

    runs-on: ubuntu-latest

    steps:
      - name: Delete companion branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: companion_pr_${{ github.event.pull_request.number }}
        run: |
          if ! output=$(gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH_NAME" 2>&1); then
            # GitHub answers 422 for a missing ref, every other error is a real failure
            if [[ "$output" == *"HTTP 422"* || "$output" == *"HTTP 404"* ]]; then
              echo "No companion branch $BRANCH_NAME to delete"
            else
              echo "$output"
              exit 1
            fi
          fi
